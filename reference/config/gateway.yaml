model_list: []
litellm_settings:
  set_verbose: false
  json_logs: true
  request_timeout: 300
  default_key_generate_params:
    max_budget: 5
    budget_duration: 1d
    rpm_limit: 60
    max_parallel_requests: 4
    models: [no-default-models]
    allowed_routes: [/v1/chat/completions, /chat/completions, /v1/models, /models]
router_settings:
  num_retries: 1
  timeout: 300
general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  database_connection_pool_limit: 4
  store_model_in_db: true
  store_prompts_in_spend_logs: false
  maximum_spend_logs_retention_period: 30d
  maximum_spend_logs_retention_interval: 1h
  fail_closed_budget_enforcement: true
  disable_budget_reservation: false
  allow_client_side_credentials: false
  trusted_proxy_ranges: []
  allowed_file_extensions: []
  enforce_fallback_model_access: true
  # Bootstrap stays closed to all browser logins. The local administrator is
  # onboarded through a one-time invitation created by the protected admin tool.
  disable_env_credential_login: true
